name: CLI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Ensure Cargo metadata is available
        run: cargo --version
      - name: Test CLI and tool boundaries
        run: python -m unittest discover -s tests -v
      - name: Lint Python
        run: uvx ruff check flatpak_workbench tests
      - name: Build Python distributions
        run: uv build
      - name: Test installed entry point
        run: |
          uv venv
          uv pip install dist/*.whl
          .venv/bin/flatpak-workbench --help
